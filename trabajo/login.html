<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" href="/static/img/icon.png">
<link rel="stylesheet" href="/static/css/bootstrap.min.css">
<link rel="stylesheet" href="/static/css/main.css">
<script src="/static/js/bootstrap.min.js"></script>
<script src="/static/js/tailwind.js"></script>
<title>Artificial University | Log-in</title>
</head>

<body>
    <div
        class="lg:max-w-screen w-full flex flex-col items-center relative overflow-x-hidden lg:p-0 body-font overflow-hidden h-screen bg-blue-950 z-0">
        <div
            class="container mt-16 px-5 py-24 mx-auto flex rounded-[.4rem] bg-gradient-to-t lg:bg-gradient-to-b from-slate-800 to-slate-900 shadow-lg shadow-blue-950 border-[1px] border-blue-800">
            <div class="mx-auto text-center">
                
<h1 class="text-purple-500 text-2xl font-bold">[Login form]</h1>
<form action="/login" method="post" class="p-2 mt-4 flex flex-col gap-2">
    <input id="email" type="email" name="email" class="rounded-md p-2" placeholder="your email" />
    <input id="password" type="password" name="password" class="rounded-md p-2" placeholder="your password" />
    <button id="login-btn" type="submit" class="rounded-md transition-all hover:bg-purple-600 block p-2 text-white bg-purple-500 font-semibold tracking-widest">Login</button>
    <a href="/register" class="text-white text-lg font-semibold">Or create a new user</a>
</form>

            </div>
        </div>
        <img loading="lazy" width="300" height="200" decoding="async" data-nimg="1"
            class="absolute w-full -z-10 -top-12 left-[50%] translate-x-[-50%] opacity-[100%] max-h-[62rem] object-cover"
            src="/static/img/future.svg">
    </div>
</body>

</html>
